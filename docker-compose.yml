services:
  # Front : build Vite servi par nginx
  frontend:
    build:
      context: ./frontend
      args:
        VITE_USE_MOCKS: "false"   # le front appelle l'API du conteneur api (via nginx)
    container_name: iris-frontend
    ports:
      - "8080:80"   # http://localhost:8080
    depends_on:
      - api
    restart: unless-stopped

  # Back : API PHP Slim (Apache)
  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: iris-api
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: iris_space
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3000:80"   # http://localhost:3000/api/health
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Back : base PostgreSQL
  db:
    image: postgres:17-alpine
    container_name: iris-db
    environment:
      POSTGRES_DB: iris_space
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}   # défini dans .env (voir .env.example)
    volumes:
      - db_data:/var/lib/postgresql/data
      # Les scripts de ce dossier ne sont exécutés qu'à l'init du volume
      - ./backend/database/init_database.sql:/docker-entrypoint-initdb.d/01_init_database.sql:ro
      - ./backend/database/seed_demo.sql:/docker-entrypoint-initdb.d/02_seed_demo.sql:ro   # données de démo (dev uniquement)
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris -d iris_space"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Outil d'admin de la base : http://localhost:8081
  adminer:
    image: adminer:latest
    container_name: iris-adminer
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8081:8080"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data:
