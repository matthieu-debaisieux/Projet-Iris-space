services:
  # Front : build Vite servi par nginx
  frontend:
    build: ./frontend
    container_name: iris-frontend
    ports:
      - "8080:80"   # http://localhost:8080
    depends_on:
      - api
    restart: unless-stopped

  # Back : API PHP Slim (Apache)
  api:
    build: ./backend
    container_name: iris-api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: iris_space
      DB_USER: iris
      DB_PASSWORD: iris
    ports:
      - "3000:80"   # http://localhost:3000/api/health
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Back : base PostgreSQL
  db:
    image: postgres:17-alpine
    container_name: iris-db
    environment:
      POSTGRES_DB: iris_space
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: iris   # à changer / mettre dans un .env en prod
    volumes:
      - db_data:/var/lib/postgresql/data
      # Les scripts de ce dossier ne sont exécutés qu'à l'init du volume
      - ./backend/database/init_database.sql:/docker-entrypoint-initdb.d/init_database.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris -d iris_space"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
