<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages Administration</title>
    <link rel="stylesheet" href="../../style/style.css">
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- navbar -->
    <navbar class="flex justify-between items-center bg-[var(--color-principal)] sticky top-0 z-50 shrink-0">
        <div class="flex items-center gap-5">
            <div class="logo"><a href="../../../../index.html"><img src="../../img/Logo_IRIS_SPACE.svg" alt="Logo" class="h-auto w-40 p-0 m-0"></a></div>
            <div class="title text-2xl text-white">Admin</div>
        </div>
        <div class="flex items-center">
            <!-- icône messages avec badge notification -->
            <div class="relative hidden md:block pr-4">
                <a href="Messages.html" id="msg-icon-link">
                    <img src="../../img/messages.svg" alt="Messages" class="h-auto w-15 p-0 m-0">
                </a>
                <span id="msg-badge"
                      class="hidden absolute -top-1 right-3 min-w-[20px] h-5 bg-red-600 text-white text-xs font-bold rounded-full items-center justify-center px-1 leading-none pointer-events-none">
                </span>
            </div>

            <!-- menu burger -->
            <div class="md:hidden pr-4">
                <label class="btn border-0 bg-[var(--color-principal)] swap swap-rotate active:scale-100 active:translate-y-0 shadow-none active:shadow-none">
                    <input type="checkbox" />
                    <svg class="swap-off fill-current filter invert" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 512 512">
                        <path d="M64,384H448V341.33H64Zm0-106.67H448V234.67H64ZM64,128v42.67H448V128Z" />
                    </svg>
                    <svg class="swap-on fill-current filter invert" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 512 512">
                        <polygon points="400 145.49 366.51 112 256 222.51 145.49 112 112 145.49 222.51 256 112 366.51 145.49 400 256 289.49 366.51 400 400 366.51 289.49 256 400 145.49" />
                    </svg>
                </label>
            </div>
        </div>
    </navbar>

    <!-- menu déroulant (overlay) -->
    <div class="fixed inset-0 z-50 hidden" id="dropdown-overlay">
        <div class="absolute inset-0 bg-black/40 transition-opacity duration-300" id="dropdown-backdrop"></div>
        <div id="dropdown-panel"
             class="absolute top-0 right-0 h-full w-72 bg-[var(--color-secondaire)] rounded-l-3xl shadow-2xl flex flex-col p-6 translate-x-full transition-transform duration-300 ease-in-out">
            <div class="flex justify-end mb-8">
                <button id="dropdown-close" class="text-white text-3xl font-bold leading-none hover:scale-125 transition-transform duration-200" aria-label="Fermer le menu">→</button>
            </div>
            <nav class="flex flex-col gap-5">
                <a href="AdminAccueil.html" class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200">DashBoard</a>
                <a href="Abscence.html" class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200">Absences</a>
                <a href="EmploisDuTemps.html" class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200">Emplois du temps</a>
                <a href="Messages.html" class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200">Messages</a>
                <a href="documents.html" class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200">Documents</a>
                <a href="Actualite.html" class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200">Actualité</a>
            </nav>
        </div>
    </div>

    <!-- layout principal -->
    <div class="flex flex-1 overflow-hidden">

        <!-- sidebar : navigation -->
      <div
        class="hidden md:flex flex-col w-64 bg-[var(--color-principal)] overflow-y-auto p-6 shrink-0"
      >
        <nav class="flex flex-col gap-5 flex-1">
          <a
            href="AdminAccueil.html"
            class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200"
            >DashBoard</a
          >
          <a
            href="Abscence.html"
            class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200"
            >Absences</a
          >
          <a
            href="EmploisDuTemps.html"
            class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200"
            >Emplois du temps</a
          >
          <!-- <a
            href="Directions.html"
            class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200"
            >Directions</a
          > -->
          <a
            href="Messages.html"
            class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200"
            >Messages</a
          >
          <!-- <a
            href="Administration.html"
            class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200"
            >Administration</a
          > -->
          <a
            href="documents.html"
            class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200"
            >Documents</a
          >
          <a
            href="Actualite.html"
            class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200"
            >Actualité</a
          >
        </nav>
      </div>

        <!-- colonne : liste des conversations -->
        <div class="hidden lg:flex flex-col w-80 bg-[var(--color-principal)] overflow-hidden shrink-0 border-l border-white/10">

            <!-- profil utilisateur courant -->
            <div class="flex flex-col items-center gap-2 px-6 pt-6">
                <div class="w-16 h-16 rounded-full bg-[var(--color-background)] shrink-0"></div>
                <p class="text-white text-lg font-semibold tracking-wide">NOM PRENOM</p>
            </div>

            <!-- barre de recherche -->
            <div class="px-6 pt-4 pb-5">
                <label class="flex items-center gap-2 bg-white rounded-full px-4 py-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M11 18a7 7 0 100-14 7 7 0 000 14z" />
                    </svg>
                    <input type="text" id="conv-search" placeholder="Rechercher"
                           class="w-full bg-transparent outline-none text-sm text-gray-700 placeholder-gray-400" />
                </label>
            </div>

            <div class="mx-6 border-t border-white/20"></div>

            <!-- liste (remplie par messages.js) -->
            <div id="conv-list" class="flex-1 overflow-y-auto px-4 py-3 flex flex-col gap-1"></div>
        </div>

        <!-- panneau de discussion -->
        <div class="flex-1 flex flex-col bg-[var(--color-page)] overflow-hidden">

            <!-- en-tête de la conversation (rempli par messages.js) -->
            <div class="flex items-center gap-4 px-6 py-4 border-b border-gray-200 shrink-0">
                <div id="chat-avatars" class="relative shrink-0 w-14 h-12"></div>
                <div class="min-w-0">
                    <h1 id="chat-name" class="text-2xl font-bold text-gray-900 leading-tight"></h1>
                    <p id="chat-lastseen" class="text-gray-400 text-sm"></p>
                </div>
            </div>

            <!-- fil de messages (rempli par messages.js) -->
            <div id="message-thread" class="flex-1 overflow-y-auto px-6 py-6 flex flex-col gap-6"></div>

            <!-- barre de saisie -->
            <form id="message-form" class="flex items-center gap-4 px-6 py-4 shrink-0">
                <input type="text" id="message-input" placeholder="Tapez votre message …"
                       class="flex-1 bg-[var(--color-background)] rounded-full px-6 py-4 text-lg text-gray-700 placeholder-gray-500 outline-none" />
                <button type="submit" aria-label="Envoyer"
                        class="w-14 h-14 shrink-0 rounded-full bg-[var(--color-button)] text-white flex items-center justify-center hover:opacity-90 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <!-- footer -->
    <div class="flex justify-start align-middle p-2 bg-[#5D5C60] shrink-0">
        <div class="text-white text-sm flex items-center">
            <button class="text-white text-xl font-medium hover:-translate-y-1 transition-transform duration-200">Mentions légales</button>
            <span class="self-stretch w-px bg-white mx-3"></span>
            <button class="text-white text-xl font-medium hover:-translate-y-1 transition-transform duration-200">Politique de confidentialité</button>
            <span class="self-stretch w-px bg-white mx-3"></span>
            <a href="https://mediaschool.eu/" target="_blank"><img src="../../img/ms_logo_cmjn_blanc_1.png" alt="Logo" class="h-12"></a>
        </div>
    </div>

    <!-- ===== PANEL DEBUG / DEV ===== -->
    <div id="debug-panel"
         class="fixed bottom-16 right-4 z-[200] hidden w-64 bg-[var(--color-principal)] text-white rounded-2xl shadow-2xl p-4 border border-[var(--color-secondaire)]">
        <div class="flex justify-between items-center mb-4">
            <span class="font-bold text-[var(--color-secondaire)] text-sm uppercase tracking-wider">🛠 Dev Tools</span>
            <button id="debug-close" class="text-gray-400 hover:text-white text-lg font-bold leading-none transition-colors">✕</button>
        </div>

        <div class="flex flex-col gap-2 text-sm">
            <p class="text-gray-400 text-xs uppercase tracking-wider mb-1">Compteur messages</p>
            <div class="flex items-center gap-2">
                <button id="dev-msg-add"
                        class="flex-1 bg-green-600 hover:bg-green-700 text-white rounded-lg px-3 py-2 transition font-bold">
                    +1
                </button>
                <button id="dev-msg-remove"
                        class="flex-1 bg-red-600 hover:bg-red-700 text-white rounded-lg px-3 py-2 transition font-bold">
                    -1
                </button>
                <button id="dev-msg-reset"
                        class="flex-1 bg-gray-600 hover:bg-gray-700 text-white rounded-lg px-3 py-2 transition text-xs font-medium">
                    Reset
                </button>
            </div>
            <div class="flex items-center justify-between bg-white/10 rounded-lg px-3 py-2 mt-1">
                <span class="text-gray-300 text-xs">Compteur actuel :</span>
                <span id="debug-counter" class="text-[var(--color-secondaire)] font-bold text-lg">0</span>
            </div>

            <p class="text-gray-400 text-xs uppercase tracking-wider mt-3 mb-1">Messages (Lorem)</p>
            <button id="dev-add-contact"
                    class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-3 py-2 text-left transition font-medium text-xs">
                + Ajouter un contact
            </button>
            <button id="dev-add-message"
                    class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-3 py-2 text-left transition font-medium text-xs">
                + Ajouter un message
            </button>
            <button id="dev-reset-conv"
                    class="bg-gray-600 hover:bg-gray-700 text-white rounded-lg px-3 py-2 text-left transition font-medium text-xs">
                Reset conversations
            </button>

            <p class="text-gray-400 text-xs uppercase tracking-wider mt-3 mb-1">Données</p>
            <button id="dev-reset-data"
                    class="bg-orange-600 hover:bg-orange-700 text-white rounded-lg px-3 py-2 text-left transition font-medium text-xs">
                Reset données (défaut)
            </button>
        </div>
    </div>

    <!-- bouton toggle panel debug -->
    <button id="debug-toggle"
            class="fixed bottom-4 right-4 z-[200] bg-[var(--color-principal)] border-2 border-[var(--color-secondaire)] text-[var(--color-secondaire)] font-bold text-xs px-3 py-2 rounded-full shadow-lg hover:bg-[var(--color-secondaire)] hover:text-[var(--color-principal)] transition-all duration-200"
            title="Menu développeur">
        DEV
    </button>

    <script type="module" src="/src/assets/script/script.js"></script>
    <script type="module" src="/src/assets/script/messages.js"></script>
</body>
</html>
