    <!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emplois du temps Administration</title>
    <link rel="stylesheet" href="../../style/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/3.4.1/tailwind.min.js"></script>
  </head>
  <body class="flex flex-col h-screen overflow-hidden">
    <!-- navbar -->
    <navbar
      class="flex justify-between items-center bg-[var(--color-principal)] sticky top-0 z-50 shrink-0"
    >
      <div class="flex items-center gap-5">
        <div class="logo">
          <a href="../../../../index.html"
            ><img
              src="../../img/Logo_IRIS_SPACE.svg"
              alt="Logo"
              class="h-auto w-40 p-0 m-0"
          /></a>
        </div>
        <div class="title text-2xl text-white">Admin</div>
      </div>
      <div class="flex items-center">
        <!-- icône messages avec badge notification -->
        <div class="relative hidden md:block pr-4">
          <a href="Messages.html" id="msg-icon-link">
            <img
              src="../../img/messages.svg"
              alt="Messages"
              class="h-auto w-15 p-0 m-0"
            />
          </a>
          <span
            id="msg-badge"
            class="hidden absolute -top-1 right-3 min-w-[20px] h-5 bg-red-600 text-white text-xs font-bold rounded-full items-center justify-center px-1 leading-none pointer-events-none"
          >
          </span>
        </div>

        <!-- menu burger -->
        <div class="md:hidden pr-4">
          <label
            class="btn border-0 bg-[var(--color-principal)] swap swap-rotate active:scale-100 active:translate-y-0 shadow-none active:shadow-none"
          >
            <input type="checkbox" />
            <svg
              class="swap-off fill-current filter invert"
              xmlns="http://www.w3.org/2000/svg"
              width="32"
              height="32"
              viewBox="0 0 512 512"
            >
              <path
                d="M64,384H448V341.33H64Zm0-106.67H448V234.67H64ZM64,128v42.67H448V128Z"
              />
            </svg>
            <svg
              class="swap-on fill-current filter invert"
              xmlns="http://www.w3.org/2000/svg"
              width="32"
              height="32"
              viewBox="0 0 512 512"
            >
              <polygon
                points="400 145.49 366.51 112 256 222.51 145.49 112 112 145.49 222.51 256 112 366.51 145.49 400 256 289.49 366.51 400 400 366.51 289.49 256 400 145.49"
              />
            </svg>
          </label>
        </div>
      </div>
    </navbar>

    <!-- menu déroulant (overlay) -->
    <div class="fixed inset-0 z-50 hidden" id="dropdown-overlay">
      <div
        class="absolute inset-0 bg-black/40 transition-opacity duration-300"
        id="dropdown-backdrop"
      ></div>
      <div
        id="dropdown-panel"
        class="absolute top-0 right-0 h-full w-72 bg-[var(--color-secondaire)] rounded-l-3xl shadow-2xl flex flex-col p-6 translate-x-full transition-transform duration-300 ease-in-out"
      >
        <div class="flex justify-end mb-8">
          <button
            id="dropdown-close"
            class="text-white text-3xl font-bold leading-none hover:scale-125 transition-transform duration-200"
            aria-label="Fermer le menu"
          >
            →
          </button>
        </div>
        <nav class="flex flex-col gap-5">
          <a
            href="AdminAccueil.html"
            class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200"
            >DashBoard</a
          >
          <a
            href="Abscence.html"
            class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200"
            >Absences</a
          >
          <a
            href="EmploisDuTemps.html"
            class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200"
            >Emplois du temps</a
          >
          <a
            href="Directions.html"
            class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200"
            >Directions</a
          >
          <a
            href="Messages.html"
            class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200"
            >Messages</a
          >
          <a
            href="Administration.html"
            class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200"
            >Administration</a
          >
          <a
            href="documents.html"
            class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200"
            >Documents</a
          >
          <a
            href="Actualite.html"
            class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200"
            >Actualité</a
          >
        </nav>
      </div>
    </div>

    <!-- layout principal -->
    <div class="flex flex-1 overflow-hidden">
      <!-- sidebar -->
      <div
        class="hidden md:flex flex-col w-64 bg-[var(--color-principal)] overflow-y-auto p-6 shrink-0"
      >
        <nav class="flex flex-col gap-5 flex-1">
          <a
            href="AdminAccueil.html"
            class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200"
            >DashBoard</a
          >
          <a
            href="Abscence.html"
            class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200"
            >Absences</a
          >
          <a
            href="EmploisDuTemps.html"
            class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200"
            >Emplois du temps</a
          >
          <a
            href="Messages.html"
            class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200"
            >Messages</a
          >
          <a
            href="documents.html"
            class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200"
            >Documents</a
          >
          <a
            href="Actualite.html"
            class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200"
            >Actualité</a
          >
        </nav>
      </div>

      <!-- contenu principal -->
      <div class="flex-1 overflow-y-auto p-6 bg-[var(--color-page)]">
        <div class="max-w-7xl mx-auto">

          <!-- Titre + sélecteur de classe -->
          <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
            <h1 class="text-2xl font-bold text-[var(--color-titre)]">
              Emplois du temps
            </h1>

            <div class="flex items-center gap-3">
              <label for="classSelect" class="text-sm font-medium text-gray-600">
                Classe :
              </label>
              <select
                id="classSelect"
                class="border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-400"
              ></select>
            </div>
          </div>

          <!-- Boutons de gestion -->
          <div class="flex flex-wrap items-center gap-2 mb-6">
            <button
              id="btn-add-class"
              class="flex items-center gap-1 px-3 py-2 text-sm rounded-lg border border-gray-300 bg-white hover:bg-gray-50 shadow-sm transition"
            >
              <span class="text-base leading-none">+</span> Ajouter une classe
            </button>
            <button
              id="btn-add-room"
              class="flex items-center gap-1 px-3 py-2 text-sm rounded-lg border border-gray-300 bg-white hover:bg-gray-50 shadow-sm transition"
            >
              <span class="text-base leading-none">+</span> Ajouter une salle
            </button>
            <button
              id="btn-add-course"
              class="flex items-center gap-1 px-3 py-2 text-sm rounded-lg bg-amber-400 hover:bg-amber-500 text-white font-medium shadow-sm transition"
            >
              <span class="text-base leading-none">+</span> Ajouter un cours
            </button>
          </div>

          <!-- Header: navigation semaine -->
          <div class="flex items-center justify-center gap-3 mb-6">
            <button
              id="prevWeek"
              class="w-9 h-9 flex items-center justify-center rounded-full bg-amber-400 hover:bg-amber-500 text-white shadow transition"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </button>

            <div id="weekLabel" class="px-6 py-2 rounded-full bg-amber-400 text-white font-semibold shadow text-sm">
              Semaine du 00 au 00 mois
            </div>

            <button
              id="nextWeek"
              class="w-9 h-9 flex items-center justify-center rounded-full bg-amber-400 hover:bg-amber-500 text-white shadow transition"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
          </div>


          <!-- Grille du planning -->
          <div
            class="border border-gray-800 overflow-hidden rounded-lg"
            style="display: grid; grid-template-columns: 80px repeat(5, 1fr);"
            id="timetable-grid"
          >
            <!-- Ligne des jours -->
            <div class="border-b border-r border-gray-800 bg-gray-50" style="grid-column: 1; grid-row: 1;"></div>
            <div class="border-b border-r border-gray-800 py-2 text-center text-sm font-semibold text-gray-800 bg-gray-50" id="day-0" style="grid-column: 2; grid-row: 1;"></div>
            <div class="border-b border-r border-gray-800 py-2 text-center text-sm font-semibold text-gray-800 bg-gray-50" id="day-1" style="grid-column: 3; grid-row: 1;"></div>
            <div class="border-b border-r border-gray-800 py-2 text-center text-sm font-semibold text-gray-800 bg-gray-50" id="day-2" style="grid-column: 4; grid-row: 1;"></div>
            <div class="border-b border-r border-gray-800 py-2 text-center text-sm font-semibold text-gray-800 bg-gray-50" id="day-3" style="grid-column: 5; grid-row: 1;"></div>
            <div class="border-b border-gray-800 py-2 text-center text-sm font-semibold text-gray-800 bg-gray-50" id="day-4" style="grid-column: 6; grid-row: 1;"></div>

            <!-- Les cellules horaires générées en JS sont ajoutées directement
                 ici comme enfants de #timetable-grid (voir renderGrid). -->
          </div>
        </div>
      </div>
    </div>

    <!-- footer -->
    <div class="flex justify-start align-middle p-2 bg-[#5D5C60] shrink-0">
      <div class="text-white text-sm flex items-center">
        <button
          class="text-white text-xl font-medium hover:-translate-y-1 transition-transform duration-200"
        >
          Mentions légales
        </button>
        <span class="self-stretch w-px bg-white mx-3"></span>
        <button
          class="text-white text-xl font-medium hover:-translate-y-1 transition-transform duration-200"
        >
          Politique de confidentialité
        </button>
        <span class="self-stretch w-px bg-white mx-3"></span>
        <a href="https://mediaschool.eu/" target="_blank"
          ><img src="../../img/ms_logo_cmjn_blanc_1.png" alt="Logo" class="h-12"
        /></a>
      </div>
    </div>

    <!-- Modale : ajouter une classe -->
    <div id="modal-add-class" class="hidden fixed inset-0 z-[100] items-center justify-center bg-black/40">
      <div class="bg-white rounded-lg shadow-2xl p-6 w-full max-w-sm mx-4">
        <h3 class="text-lg font-bold text-[var(--color-titre)] mb-4">Ajouter une classe</h3>
        <label class="text-xs font-medium text-gray-600">Nom de la classe</label>
        <input
          id="new-class-name"
          type="text"
          placeholder="ex : 4ème C"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 mt-1 mb-4 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400"
        />
        <div class="flex justify-end gap-2">
          <button id="cancel-add-class" class="px-4 py-2 text-sm rounded-lg border border-gray-300 hover:bg-gray-50 transition">Annuler</button>
          <button id="confirm-add-class" class="px-4 py-2 text-sm rounded-lg bg-amber-400 hover:bg-amber-500 text-white font-medium transition">Ajouter</button>
        </div>
      </div>
    </div>

    <!-- Modale : ajouter une salle -->
    <div id="modal-add-room" class="hidden fixed inset-0 z-[100] items-center justify-center bg-black/40">
      <div class="bg-white rounded-lg shadow-2xl p-6 w-full max-w-sm mx-4">
        <h3 class="text-lg font-bold text-[var(--color-titre)] mb-4">Ajouter une salle</h3>
        <label class="text-xs font-medium text-gray-600">Nom de la salle</label>
        <input
          id="new-room-name"
          type="text"
          placeholder="ex : Labo 4"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 mt-1 mb-4 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400"
        />
        <div class="flex justify-end gap-2">
          <button id="cancel-add-room" class="px-4 py-2 text-sm rounded-lg border border-gray-300 hover:bg-gray-50 transition">Annuler</button>
          <button id="confirm-add-room" class="px-4 py-2 text-sm rounded-lg bg-amber-400 hover:bg-amber-500 text-white font-medium transition">Ajouter</button>
        </div>
      </div>
    </div>

    <!-- Modale : ajouter / modifier un cours -->
    <div id="modal-course" class="hidden fixed inset-0 z-[100] items-center justify-center bg-black/40">
      <div class="bg-white rounded-lg shadow-2xl p-6 w-full max-w-md mx-4">
        <h3 id="course-modal-title" class="text-lg font-bold text-[var(--color-titre)] mb-4">Ajouter un cours</h3>
        <p id="course-modal-class" class="text-xs text-gray-400 mb-4"></p>

        <div class="grid grid-cols-2 gap-3 mb-4">
          <div class="col-span-2">
            <label class="text-xs font-medium text-gray-600">Jour</label>
            <select id="course-day" class="w-full border border-gray-300 rounded-lg px-3 py-2 mt-1 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400"></select>
          </div>
          <div>
            <label class="text-xs font-medium text-gray-600">Début</label>
            <select id="course-start" class="w-full border border-gray-300 rounded-lg px-3 py-2 mt-1 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400"></select>
          </div>
          <div>
            <label class="text-xs font-medium text-gray-600">Fin</label>
            <select id="course-end" class="w-full border border-gray-300 rounded-lg px-3 py-2 mt-1 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400"></select>
          </div>
          <div class="col-span-2">
            <label class="text-xs font-medium text-gray-600">Matière</label>
            <input id="course-subject" type="text" placeholder="ex : Mathématiques" class="w-full border border-gray-300 rounded-lg px-3 py-2 mt-1 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400" />
          </div>
          <div class="col-span-2">
            <label class="text-xs font-medium text-gray-600">Intervenant</label>
            <input id="course-intervenant" type="text" placeholder="ex : Intervenant 1" class="w-full border border-gray-300 rounded-lg px-3 py-2 mt-1 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400" />
          </div>
          <div class="col-span-2">
            <label class="text-xs font-medium text-gray-600">Salle</label>
            <select id="course-room" class="w-full border border-gray-300 rounded-lg px-3 py-2 mt-1 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400"></select>
          </div>
        </div>

        <p id="course-modal-error" class="hidden text-xs text-red-600 mb-3"></p>

        <div class="flex justify-between items-center">
          <button id="delete-course" class="hidden px-4 py-2 text-sm rounded-lg border border-red-300 text-red-600 hover:bg-red-50 transition">
            Supprimer
          </button>
          <div class="flex gap-2 ml-auto">
            <button id="cancel-course" class="px-4 py-2 text-sm rounded-lg border border-gray-300 hover:bg-gray-50 transition">Annuler</button>
            <button id="confirm-course" class="px-4 py-2 text-sm rounded-lg bg-amber-400 hover:bg-amber-500 text-white font-medium transition">Enregistrer</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/assets/script/script.js"></script>
    <script type="module" src="/src/assets/script/EmploisDuTemps.js"></script>
  </body>
</html>
