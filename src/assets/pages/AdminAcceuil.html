
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Administration</title>
    <link rel="stylesheet" href="../style/style.css">
</head>
<body class="flex flex-col h-screen overflow-hidden">
    <!-- navbar -->
    <navbar class="flex justify-between items-center bg-[var(--color-principal)] sticky top-0 z-50 shrink-0">
        <!-- partie gauche de la navbar -->
        <div class="flex items-center gap-5">
            <div class="logo"><a href="../../../index.html"><img src="../img/Logo_IRIS_SPACE.svg" alt="Logo" class="h-auto w-40 p-0 m-0"></a></div>
            <div class="title text-2xl text-white">Admin</div>
        </div>
        <!-- partie droite de la navbar -->
        <div>
            <!-- logo messages -->
            <div class="logo hidden md:block pr-4"><a href="../../../index.html"><img src="../img/messages.svg" alt="Logo" class="h-auto w-15 p-0 m-0"></a></div>

            <!-- menu burger -->
            <div class="md:hidden pr-4" ><label class="btn border-0 bg-[var(--color-principal)] swap swap-rotate active:scale-100 active:translate-y-0 shadow-none active:shadow-none">
                <!-- Cette checkbox masquée permet de contrôler l'état de la navbar-->
                <input type="checkbox" />

                <!-- icon hamburger -->
                <svg
                    class="swap-off fill-current filter invert"
                    xmlns="http://www.w3.org/2000/svg"
                    width="32"
                    height="32"
                    viewBox="0 0 512 512">
                    <path d="M64,384H448V341.33H64Zm0-106.67H448V234.67H64ZM64,128v42.67H448V128Z" />
                </svg>

                <!-- icon de fermeture -->
                <svg
                    class="swap-on fill-current filter invert"
                    xmlns="http://www.w3.org/2000/svg"
                    width="32"
                    height="32"
                    viewBox="0 0 512 512">
                    <polygon
                    points="400 145.49 366.51 112 256 222.51 145.49 112 112 145.49 222.51 256 112 366.51 145.49 400 256 289.49 366.51 400 400 366.51 289.49 256 400 145.49" />
                </svg>
                </label>
            </div>
        </div>
    </navbar>

    <!-- menu déroulant (overlay) -->
    <div class="fixed inset-0 z-50 hidden" id="dropdown-overlay">
        <!-- backdrop sombre -->
        <div class="absolute inset-0 bg-black/40 transition-opacity duration-300" id="dropdown-backdrop"></div>

        <!-- panneau latéral -->
        <div id="dropdown-panel"
             class="absolute top-0 right-0 h-full w-72 bg-[var(--color-secondaire)] rounded-l-3xl shadow-2xl flex flex-col p-6 translate-x-full transition-transform duration-300 ease-in-out">

            <!-- bouton fermeture -->
            <div class="flex justify-end mb-8">
                <button id="dropdown-close"
                        class="text-white text-3xl font-bold leading-none hover:scale-125 transition-transform duration-200"
                        aria-label="Fermer le menu">
                    →
                </button>
            </div>

            <!-- liens de navigation -->
            <nav class="flex flex-col gap-5">
                <a href="#" class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200">DashBoard</a>
                <a href="#" class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200">Elèves</a>
                <a href="#" class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200">Professeurs</a>
                <a href="#" class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200">Directions</a>
                <a href="#" class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200">Messages</a>
                <a href="#" class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200">Administration</a>
                <a href="#" class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200">Arborescence</a>
                <a href="#" class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200">Actualité</a>
            </nav>
        </div>
    </div>

    <!-- layout principal -->
    <div class="flex flex-1 overflow-hidden">
        <!-- sidebar -->
        <div class="hidden md:flex flex-col w-64 bg-[var(--color-principal)] overflow-y-auto p-6 shrink-0">
            <nav class="flex flex-col gap-5 flex-1">
                <a href="#" class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200">DashBoard</a>
                <a href="#" class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200">Elèves</a>
                <a href="#" class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200">Professeurs</a>
                <a href="#" class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200">Directions</a>
                <a href="#" class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200">Messages</a>
                <a href="#" class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200">Administration</a>
                <a href="#" class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200">Arborescence</a>
                <a href="#" class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200 mt-auto">Actualité</a>
            </nav>
        </div>

        <!-- content -->
        <div class="flex-1 overflow-y-auto p-6">
        
        </div>
    </div>

    <div class="flex justify-start align-middle p-2 bg-[#5D5C60] shrink-0">
        <div class="text-white text-sm flex items-center"><button class=" text-white text-xl font-medium hover:-translate-y-1 transition-transform duration-200">Mentions légales</button>
            <span class="self-stretch w-px bg-white mx-3"></span>
            <button class="text-white text-xl font-medium hover:-translate-y-1 transition-transform duration-200">Politique de confidentialité</button>
            <span class="self-stretch w-px bg-white mx-3"></span>
            <a href="https://mediaschool.eu/" target="_blank" class=""><img src="../img/ms_logo_cmjn_blanc_1.png" alt="Logo" class="h-12"></a>
        </div>
    </div>

    <script type="module" src="/src/assets/script/script.js"></script>
</body>
</html>
