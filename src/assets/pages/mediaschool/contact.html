<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IRIS-SPACE — Page en construction</title>
    <link rel="stylesheet" href="../../style/style.css" />
    <style>
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-18px);
        }
      }
      @keyframes spin-slow {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes progress {
        0% {
          width: 0%;
        }
        50% {
          width: 70%;
        }
        100% {
          width: 100%;
        }
      }
      @keyframes bounce-dot {
        0%,
        80%,
        100% {
          transform: scale(0.6);
          opacity: 0.4;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }
      .wip-float {
        animation: float 3s ease-in-out infinite;
      }
      .wip-gear {
        animation: spin-slow 4s linear infinite;
        transform-origin: center;
      }
      .wip-gear-rev {
        animation: spin-slow 5s linear infinite reverse;
        transform-origin: center;
      }
      .wip-bar {
        animation: progress 2.5s ease-in-out infinite;
      }
      .wip-dot {
        animation: bounce-dot 1.4s ease-in-out infinite;
      }
      .wip-dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .wip-dot:nth-child(3) {
        animation-delay: 0.4s;
      }
    </style>
  </head>
  <body class="flex flex-col h-screen overflow-hidden">
    <!-- navbar -->
    <navbar
      class="flex justify-between items-center bg-[var(--color-principal)] sticky top-0 z-50 shrink-0 pr-4"
    >
      <div class="flex items-center gap-5">
        <div class="logo">
          <a href="../../../../index.html"
            ><img
              src="../../img/Logo_IRIS_SPACE.svg"
              alt="Logo IRIS SPACE"
              class="h-auto w-40 p-0 m-0"
          /></a>
        </div>
        <div class="title text-2xl text-white tracking-wide">PROFESSEUR</div>
      </div>
    </navbar>

    <!-- contenu principal -->
    <main
      class="flex-1 flex flex-col items-center justify-center gap-8 p-6 bg-[var(--color-page)] text-center"
    >
      <div class="relative wip-float">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="120"
          height="120"
          viewBox="0 0 24 24"
          fill="none"
          stroke="var(--color-secondaire)"
          stroke-width="1.2"
          class="wip-gear"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z M19.4 13.5a7.6 7.6 0 0 0 .1-1 7.6 7.6 0 0 0-.1-1l1.9-1.5a.5.5 0 0 0 .1-.6l-1.8-3a.5.5 0 0 0-.6-.2l-2.2.9a7.4 7.4 0 0 0-1.7-1l-.3-2.3a.5.5 0 0 0-.5-.4h-3.6a.5.5 0 0 0-.5.4l-.3 2.3a7.4 7.4 0 0 0-1.7 1l-2.2-.9a.5.5 0 0 0-.6.2l-1.8 3a.5.5 0 0 0 .1.6l1.9 1.5a7.6 7.6 0 0 0-.1 1 7.6 7.6 0 0 0 .1 1l-1.9 1.5a.5.5 0 0 0-.1.6l1.8 3a.5.5 0 0 0 .6.2l2.2-.9a7.4 7.4 0 0 0 1.7 1l.3 2.3a.5.5 0 0 0 .5.4h3.6a.5.5 0 0 0 .5-.4l.3-2.3a7.4 7.4 0 0 0 1.7-1l2.2.9a.5.5 0 0 0 .6-.2l1.8-3a.5.5 0 0 0-.1-.6l-1.9-1.5Z"
          />
        </svg>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="50"
          height="50"
          viewBox="0 0 24 24"
          fill="none"
          stroke="var(--color-principal)"
          stroke-width="1.4"
          class="wip-gear-rev absolute -bottom-2 -right-3"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z M19.4 13.5a7.6 7.6 0 0 0 .1-1 7.6 7.6 0 0 0-.1-1l1.9-1.5a.5.5 0 0 0 .1-.6l-1.8-3a.5.5 0 0 0-.6-.2l-2.2.9a7.4 7.4 0 0 0-1.7-1l-.3-2.3a.5.5 0 0 0-.5-.4h-3.6a.5.5 0 0 0-.5.4l-.3 2.3a7.4 7.4 0 0 0-1.7 1l-2.2-.9a.5.5 0 0 0-.6.2l-1.8 3a.5.5 0 0 0 .1.6l1.9 1.5a7.6 7.6 0 0 0-.1 1 7.6 7.6 0 0 0 .1 1l-1.9 1.5a.5.5 0 0 0-.1.6l1.8 3a.5.5 0 0 0 .6.2l2.2-.9a7.4 7.4 0 0 0 1.7 1l.3 2.3a.5.5 0 0 0 .5.4h3.6a.5.5 0 0 0 .5-.4l.3-2.3a7.4 7.4 0 0 0 1.7-1l2.2.9a.5.5 0 0 0 .6-.2l1.8-3a.5.5 0 0 0-.1-.6l-1.9-1.5Z"
          />
        </svg>
      </div>

      <div>
        <h1
          class="text-3xl md:text-4xl font-bold text-[var(--color-titre)] mb-3"
        >
          Page en construction
        </h1>
        <p class="text-gray-600 text-lg flex items-center justify-center gap-1">
          Cette section arrive bientôt
          <span class="flex gap-1 ml-1">
            <span
              class="wip-dot w-1.5 h-1.5 rounded-full bg-gray-500 inline-block"
            ></span>
            <span
              class="wip-dot w-1.5 h-1.5 rounded-full bg-gray-500 inline-block"
            ></span>
            <span
              class="wip-dot w-1.5 h-1.5 rounded-full bg-gray-500 inline-block"
            ></span>
          </span>
        </p>
      </div>

      <div
        class="w-64 md:w-80 h-2.5 bg-[var(--color-background)] rounded-full overflow-hidden"
      >
        <div
          class="wip-bar h-full rounded-full bg-[var(--color-secondaire)]"
        ></div>
      </div>

      <button
        id="back-btn"
        onclick="history.back()"
        class="btn bg-[var(--color-button)] text-white border-0 mt-2 hover:-translate-y-0.5 transition-transform duration-200"
      >
        ← Retour
      </button>
    </main>
  </body>
</html>
