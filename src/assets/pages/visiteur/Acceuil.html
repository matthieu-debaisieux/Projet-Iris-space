<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRIS-SPACE — Visiteur</title>
    <link rel="stylesheet" href="../../style/style.css">
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- navbar -->
    <navbar class="flex justify-between items-center bg-[var(--color-principal)] sticky top-0 z-50 shrink-0 pr-4">
        <div class="flex items-center gap-5">
            <div class="logo"><a href="../../../../index.html"><img src="../../img/Logo_IRIS_SPACE.svg" alt="Logo IRIS SPACE" class="h-auto w-40 p-0 m-0"></a></div>
            <div class="title text-2xl text-white tracking-wide">VISITEUR</div>
        </div>

        <!-- navigation desktop -->
        <nav class="hidden md:flex items-center gap-8 text-white">
            <!-- <a href="./Acceuil.html" aria-label="Accueil" class="hover:scale-110 transition-transform duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 3 2 12h3v8h6v-5h2v5h6v-8h3L12 3z" />
                </svg>
            </a> -->
            <a href="./Apropos.html" class="text-xl font-medium hover:-translate-y-0.5 transition-transform duration-200">à propos</a>
            <a href="#" class="text-xl font-medium hover:-translate-y-0.5 transition-transform duration-200">Contact</a>
            <a href="./Acceuil.html" class="text-xl font-medium hover:-translate-y-0.5 transition-transform duration-200">Actualité</a>
            <a href="../../../../index.html" class="text-xl font-medium hover:-translate-y-0.5 transition-transform duration-200">Se connecter</a>
        </nav>

        <!-- menu burger (mobile) -->
        <div class="md:hidden">
            <label class="btn border-0 bg-[var(--color-principal)] swap swap-rotate active:scale-100 active:translate-y-0 shadow-none active:shadow-none">
                <input type="checkbox" id="nav-toggle" />
                <svg class="swap-off fill-current filter invert" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 512 512">
                    <path d="M64,384H448V341.33H64Zm0-106.67H448V234.67H64ZM64,128v42.67H448V128Z" />
                </svg>
                <svg class="swap-on fill-current filter invert" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 512 512">
                    <polygon points="400 145.49 366.51 112 256 222.51 145.49 112 112 145.49 222.51 256 112 366.51 145.49 400 256 289.49 366.51 400 400 366.51 289.49 256 400 145.49" />
                </svg>
            </label>
        </div>
    </navbar>

    <!-- menu déroulant (overlay mobile) -->
    <div class="fixed inset-0 z-50 hidden" id="dropdown-overlay">
        <div class="absolute inset-0 bg-black/40 transition-opacity duration-300" id="dropdown-backdrop"></div>
        <div id="dropdown-panel"
             class="absolute top-0 right-0 h-full w-72 bg-[var(--color-secondaire)] rounded-l-3xl shadow-2xl flex flex-col p-6 translate-x-full transition-transform duration-300 ease-in-out">
            <div class="flex justify-end mb-8">
                <button id="dropdown-close" class="text-white text-3xl font-bold leading-none hover:scale-125 transition-transform duration-200" aria-label="Fermer le menu">→</button>
            </div>
            <nav class="flex flex-col gap-5">
                <a href="./Acceuil.html" class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200">Accueil</a>
                <a href="./Apropos.html" class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200">À propos</a>
                <a href="./visiteur.html" class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200">Contact</a>
                <a href="./Acceuil.html" class="text-white text-xl font-medium hover:translate-x-2 transition-transform duration-200">Actualité</a>
            </nav>
        </div>
    </div>

    <!-- contenu principal -->
    <div class="flex-1 overflow-y-auto p-6 bg-[var(--color-page)]">
        <!-- Grille 3 colonnes -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-30 max-w-screen-xl mx-auto" id="actu-grid">
        </div>
    </div>

    <!-- footer -->
    <div class="flex justify-between items-center p-2 px-4 bg-[#5D5C60] shrink-0">
        <div class="text-white text-sm flex items-center">
            <button class="text-white text-xl font-medium hover:-translate-y-1 transition-transform duration-200">Mentions légales</button>
            <span class="self-stretch w-px bg-white mx-3"></span>
            <button class="text-white text-xl font-medium hover:-translate-y-1 transition-transform duration-200">Confidentialité</button>
            <span class="self-stretch w-px bg-white mx-3"></span>
            <a href="https://mediaschool.eu/" target="_blank"><img src="../../img/ms_logo_cmjn_blanc_1.png" alt="Logo MediaSchool" class="h-12"></a>
        </div>
        <a href="https://mediaschool.eu/" target="_blank"
           class="hidden sm:inline-block text-white text-base font-medium border border-white rounded-full px-5 py-2 hover:bg-white hover:text-[#5D5C60] transition-colors duration-200">
            Page de MédiaSchool
        </a>
    </div>

    <!-- ========== MODAL POPUP ========== -->
    <div
        id="actu-modal"
        role="dialog"
        aria-modal="true"
        aria-label="Détail de l'actualité"
        style="
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            padding: 1rem;
        "
        onclick="if(event.target===this) closeActuModal()"
    >
        <div
            id="actu-modal-box"
            style="
                background: white;
                border-radius: 1.5rem;
                max-width: 520px;
                width: 100%;
                padding: 1.75rem;
                display: flex;
                flex-direction: column;
                gap: 1rem;
                transform: translateY(24px);
                transition: transform 0.25s ease;
                max-height: 90vh;
                overflow-y: auto;
            "
        >
            <!-- En-tête modal -->
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:1rem;">
                <h2 id="modal-titre" style="font-size:1.25rem; font-weight:700; color:#0f766e; margin:0; line-height:1.3;"></h2>
                <button
                    onclick="closeActuModal()"
                    aria-label="Fermer"
                    style="background:none; border:none; font-size:1.75rem; cursor:pointer; color:#9ca3af; line-height:1; flex-shrink:0; padding:0 4px; border-radius:6px; transition: color .15s;"
                    onmouseover="this.style.color='#374151'"
                    onmouseout="this.style.color='#9ca3af'"
                >×</button>
            </div>

            <!-- Image -->
            <img
                id="modal-img"
                src=""
                alt="Image de l'actualité"
                style="width:100%; height:200px; border-radius:1rem; object-fit:cover; background:#d1d5db;"
            />

            <!-- Badge + méta -->
            <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                <span style="
                    display:inline-flex; align-items:center;
                    background:#0d9488; color:white;
                    font-size:11px; font-weight:600;
                    padding:3px 12px; border-radius:999px;
                    text-transform:uppercase; letter-spacing:0.05em;
                ">Actualité</span>
                <span id="modal-meta" style="font-size:12px; color:#6b7280;"></span>
            </div>

            <!-- Contenu complet -->
            <p id="modal-contenu" style="font-size:15px; color:#374151; line-height:1.75; margin:0;"></p>

            <!-- Pied de modal -->
            <p id="modal-date" style="font-size:12px; color:#9ca3af; border-top:1px solid #f3f4f6; padding-top:.75rem; margin:0;"></p>
        </div>
    </div>
    <!-- ========== FIN MODAL ========== -->

    <script src="../../script/Visu-actualite.js"></script>
</body>
</html>
