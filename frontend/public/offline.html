<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11004A" />
    <title>Hors ligne — IRIS-SPACE</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background-color: #f5f5f5;
        color: #1f2937;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 28rem;
        width: 100%;
        background: #ffffff;
        border-radius: 1rem;
        padding: 2rem;
        box-shadow: 0 10px 25px rgba(17, 0, 74, 0.08);
        border-top: 6px solid #11004a;
        text-align: center;
      }
      h1 {
        color: #07a6a6;
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
      }
      p {
        font-size: 0.95rem;
        line-height: 1.5;
        color: #4b5563;
        margin: 0 0 1.5rem;
      }
      button {
        background-color: #ec6f6f;
        color: #ffffff;
        border: none;
        border-radius: 9999px;
        padding: 0.65rem 1.5rem;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(0.92);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Vous êtes hors ligne</h1>
      <p>
        Aucune connexion réseau n'est disponible pour le moment. Vérifiez votre accès Internet puis réessayez.
      </p>
      <button type="button" onclick="window.location.reload()">Réessayer</button>
    </main>
  </body>
</html>
