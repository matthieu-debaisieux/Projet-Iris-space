server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA : toutes les routes React Router retombent sur index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache long pour les assets fingerprintés par Vite
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Les appels /api sont transmis au conteneur de l'API Slim.
  # « api » est le nom du service dans docker-compose.yml ; dans le réseau Docker,
  # Apache écoute sur le port 80 (le port 3000 n'existe que sur la machine hôte).
  location /api/ {
    proxy_pass http://api:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 11m;   # fichiers de 10 Mo max côté API, plus l'enveloppe du formulaire
  }
}
