server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA : toutes les routes React Router retombent sur index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache long pour les assets fingerprintés par Vite
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Les appels /api sont transmis au conteneur de l'API Slim
  location /api/ {
    proxy_pass http://api:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
